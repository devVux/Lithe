name: Windows CI
on:
  push:
    branches: [ master, dev, actions ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang]
        config: [debug, release]
        include:
          - compiler: msvc
            config: debug
            configure_preset: windows-msvc
            build_preset: windows-msvc-debug
          - compiler: msvc
            config: release
            configure_preset: windows-msvc
            build_preset: windows-msvc-release
          - compiler: clang
            config: debug
            configure_preset: windows-clang
            build_preset: windows-clang-debug
          - compiler: clang
            config: release
            configure_preset: windows-clang
            build_preset: windows-clang-release
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Install LLVM/Clang
      if: matrix.compiler == 'clang'
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "19.1.0"
    - name: Install Ninja
      run: choco install ninja -y
    - name: Bootstrap vcpkg
      run: ./vendor/vcpkg/bootstrap-vcpkg.bat
    - name: Install dependencies
      run: |
        set VCPKG_ROOT=
        ./vendor/vcpkg/vcpkg install --triplet x64-windows
    - name: Configure
      run: cmake --preset ${{ matrix.configure_preset }} -DLITHE_BUILD_TESTS=ON
    - name: Build
      run: cmake --build --preset ${{ matrix.build_preset }}
    - name: Run tests
      if: matrix.config == 'Debug'
      run: ./out/build/windows/${{ matrix.compiler }}/bin/Debug/tests.exe